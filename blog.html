  }

  body {
    font-family: 'Rajdhani', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ---------- Canvas 背景 ---------- */
  canvas#bg {
    position: fixed;
    top: 0; left: 0;

    pointer-events: none;
  }

  /* ---------- 导航 ---------- */
  nav {
    position: fixed; top: 0; width: 100%;
    z-index: 100;
    padding: 1rem 4rem;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(26,28,30,0.92);
    border-bottom: 2px solid var(--border);
    backdrop-filter: blur(10px);
  }
  nav .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.3rem; font-weight: 400;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 0.3rem 0.9rem;
    letter-spacing: 2px;

  nav .logo a { color: inherit; text-decoration: none; }
  nav ul { display: flex; gap: 2rem; list-style: none; }
  nav a {
    font-family: 'Rajdhani', sans-serif;
    color: var(--muted); text-decoration: none;

    content: '// '; color: var(--accent); opacity: 0;
    transition: opacity 0.2s;
  }

    min-height: 100vh;

    border: 1px solid var(--border);

    transition: all 0.25s;

    position: relative;
    overflow: hidden;

    width: 28px; height: 28px;

    font-size: 0.9rem; color: var(--muted);
    z-index: 1; opacity: 0.3; transition: all 0.25s;

<script>
// ---------- 机械蓝图背景 ----------
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const gridSize = 50;
const gears = [];
const sparks = [];

class Gear {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.radius = 15 + Math.random() * 40;
    this.teeth = 8 + Math.floor(Math.random() * 8);
    this.angle = Math.random() * Math.PI * 2;
    this.speed = (Math.random() - 0.5) * 0.003;
    this.alpha = 0.03 + Math.random() * 0.04;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = `rgba(240,165,0,${this.alpha})`;
    ctx.lineWidth = 1;
    ctx.fillStyle = `rgba(240,165,0,${this.alpha * 0.3})`;

    // Gear body
    ctx.beginPath();
    const innerR = this.radius * 0.7;
    const outerR = this.radius;
    const teeth = this.teeth * 2;
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Center hole
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.2, 0, Math.PI * 2);
    ctx.stroke();

    // Spokes
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + this.angle;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.radius * 0.25, Math.sin(a) * this.radius * 0.25);
      ctx.lineTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
      ctx.stroke();
    }

    ctx.restore();
  }

  update() {
    this.angle += this.speed;
  }
}

class Spark {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.r = Math.random() * 1.2 + 0.3;
    this.alpha = Math.random() * 0.3 + 0.05;
    this.life = Math.random() * 200 + 100;
    this.age = 0;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3 - 0.1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.age++;
    if (this.age > this.life || this.x < -10 || this.x > w + 10 || this.y < -10 || this.y > h + 10) {
      this.reset();
    }
  }
  draw(ctx) {
    const fade = 1 - this.age / this.life;
    ctx.fillStyle = `rgba(240,165,0,${this.alpha * fade})`;
    ctx.fillRect(this.x - this.r/2, this.y - this.r/2, this.r, this.r);
  }
}

function initBg() {
  gears.length = 0;
  sparks.length = 0;
  const gearCount = Math.floor((w * h) / 80000);
  for (let i = 0; i < gearCount; i++) gears.push(new Gear());
  const sparkCount = Math.floor((w * h) / 15000);
  for (let i = 0; i < sparkCount; i++) sparks.push(new Spark());
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(58,61,64,0.25)';
  ctx.lineWidth = 0.5;
  for (let x = gridSize; x < w; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (let y = gridSize; y < h; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  // Grid intersection dots
  for (let x = gridSize; x < w; x += gridSize) {
    for (let y = gridSize; y < h; y += gridSize) {
      ctx.fillStyle = 'rgba(240,165,0,0.06)';
      ctx.fillRect(x - 1, y - 1, 2, 2);
    }
  }

  // Major grid lines
  ctx.strokeStyle = 'rgba(58,61,64,0.4)';
  ctx.lineWidth = 0.8;
  const major = gridSize * 4;
  for (let x = major; x < w; x += major) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (let y = major; y < h; y += major) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
}

function drawBorderLines() {
  ctx.strokeStyle = 'rgba(240,165,0,0.06)';
  ctx.lineWidth = 1;
  const margin = 20;
  ctx.strokeRect(margin, margin, w - margin * 2, h - margin * 2);

  // Corner marks
  const markLen = 30;
  const corners = [
    [margin, margin, 1, 0, 0, 1],
    [w - margin, margin, -1, 0, 0, 1],
    [margin, h - margin, 1, 0, 0, -1],
    [w - margin, h - margin, -1, 0, 0, -1],
  ];
  corners.forEach(([cx, cy, dx1, dy1, dx2, dy2]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + dx1 * markLen, cy + dy1 * markLen);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + dx2 * markLen, cy + dy2 * markLen);
    ctx.stroke();
  });
}

function animate() {
  ctx.clearRect(0, 0, w, h);
  drawGrid();
  drawBorderLines();
  gears.forEach(g => { g.update(); g.draw(ctx); });
  sparks.forEach(s => { s.update(); s.draw(ctx); });
  requestAnimationFrame(animate);
}

initBg();
animate();
window.addEventListener('resize', initBg);

// ---------- 文章数据 ----------
const posts = [
  {
    id: 1,
    title: '从零搭建个人网站',
    date: '2024-12-15',
    summary: '用纯 HTML/CSS/JS 从零构建一个响应式个人主页的全过程，涵盖设计思路、布局技巧与性能优化。',
    tags: ['HTML', 'CSS', 'FRONTEND'],
    content: `
      <p>搭建一个个人网站是每个开发者都想做的事情。本文记录我从零开始构建个人主页的全过程。</p>

      <h2>为什么选择纯静态方案</h2>
      <p>对于个人网站来说，<strong>简单</strong>是第一原则。不需要后端、不需要数据库、不需要复杂的构建工具。一个 HTML 文件就能搞定一切。</p>
      <p>纯静态方案的优势很明显：</p>
      <ul>
        <li>零依赖部署 — 随便一个静态服务器就能跑</li>
        <li>极快的加载速度 — 没有 JS 框架的运行时开销</li>
        <li>容易维护 — 一个文件，所见即所得</li>
      </ul>

      <h2>设计思路</h2>
      <p>我选择了<strong>暗色主题</strong>配合粒子背景，营造一种科技感的氛围。CSS 变量让颜色管理变得非常方便：</p>
      <pre><code>:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --text: #e0e0e0;
  --accent: #64ffda;
}</code></pre>
      <p>通过几行变量定义，整个网站的配色就确定下来了，后续修改主题色只需要改这里。</p>

      <h2>Canvas 粒子背景</h2>
      <p>粒子背景是页面视觉的亮点。实现原理很简单：</p>
      <ul>
        <li>创建 N 个随机位置、随机速度的粒子</li>
        <li>每帧更新粒子位置，超出边界就重置</li>
        <li>遍历粒子对，距离小于阈值的连线</li>
      </ul>
      <p>配合 <code>requestAnimationFrame</code> 实现 60fps 的流畅动画，性能开销很低。</p>

      <h2>响应式设计</h2>
      <p>使用 <code>clamp()</code> 函数实现流体排版，配合 CSS Grid 和媒体查询，让网站在手机上也很好看。</p>

      <p>整个搭建过程花了不到一个下午，但收获很多。建议每个开发者都动手造一个属于自己的角落。</p>
    `
  },
  {
    id: 2,
    title: 'Python 异步编程入门',
    date: '2024-11-20',
    summary: '理解 async/await 的核心概念，通过实际例子掌握 Python 异步编程的最佳实践。',
    tags: ['PYTHON', 'ASYNC', 'BACKEND'],
    content: `
      <p>异步编程是 Python 进阶的必经之路。本文用通俗的方式解释 async/await，帮你快速上手。</p>

      <h2>为什么要异步</h2>
      <p>假设你开了一家咖啡店。同步模式下，你必须等一位顾客的咖啡做好，才能服务下一位。异步模式则是：下单后去做下一位的咖啡，谁的先做好就先给谁。</p>
      <p>在程序中，<strong>IO 密集型</strong>任务（网络请求、文件读写、数据库查询）非常适合用异步来提升效率。</p>

      <h2>核心概念</h2>
      <h3>协程（Coroutine）</h3>
      <p>用 <code>async def</code> 定义的函数就是一个协程。调用它不会立即执行，而是返回一个协程对象。</p>
      <pre><code>import asyncio

async def fetch_data(url):
    await asyncio.sleep(1)
    return f"data from {url}"

result = asyncio.run(fetch_data("https://api.example.com"))</code></pre>

      <h3>await — 等待但不阻塞</h3>
      <p><code>await</code> 的含义是："我先去干别的，这个好了叫我"。在等待期间，事件循环可以执行其他任务。</p>

      <h3>并发执行</h3>
      <pre><code>async def main():
    tasks = [
        fetch_data(f"url_{i}")
        for i in range(5)
    ]
    results = await asyncio.gather(*tasks)
    # 5个请求总耗时约1秒，而不是5秒</code></pre>

      <h2>常见坑</h2>
      <ul>
        <li><strong>不要在协程里用 time.sleep()</strong> — 它不会释放控制权，要用 <code>await asyncio.sleep()</code></li>
        <li><strong>CPU 密集型任务不适合 asyncio</strong> — 它会阻塞事件循环，这种情况用多进程</li>
        <li><strong>注意库的支持</strong> — 只有支持异步的库（如 aiohttp、httpx）才能发挥异步优势</li>
      </ul>

      <p>掌握异步后，写爬虫、API 服务、数据处理管线的效率都会有质的飞跃。</p>

// ---------- 渲染 ----------
const listView = document.getElementById('list-view');
const detailView = document.getElementById('detail-view');
const postList = document.getElementById('post-list');

function renderList() {
  postList.innerHTML = posts.map(post => `
    <div class="post-card" onclick="showDetail(${post.id})">
      <div class="post-meta">
        <span class="post-date">${post.date}</span>
        <span class="post-id">#00${post.id}</span>
      </div>
      <h2>${post.title}</h2>
      <p class="post-summary">${post.summary}</p>
      <div class="post-tags">
        ${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function showDetail(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  document.getElementById('detail-date').textContent = post.date;
  document.getElementById('detail-id').textContent = '#00' + post.id;
  document.getElementById('detail-title').textContent = post.title;
  document.getElementById('detail-tags').innerHTML = post.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('detail-content').innerHTML = post.content;
  listView.style.display = 'none';
  detailView.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showList() {
  detailView.style.display = 'none';
  listView.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderList();
</script>
