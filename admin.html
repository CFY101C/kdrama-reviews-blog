<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap');
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fef9f4;
    --surface: #ffffff;
    --text: #3d2c2c;
    --muted: #8b7b7b;
    --accent: #e8817f;
    --accent-soft: #f5d5d3;
    --accent-dark: #d4706e;
    --border: #f0e4df;
    --shadow: 0 2px 20px rgba(120, 80, 60, 0.06);
    --radius: 16px;
    --radius-sm: 10px;
    --font-serif: 'Noto Serif SC', 'Noto Serif KR', 'STSong', 'SimSun', 'Songti SC', serif;
    --duration: 0.3s;
  }

  body {
    font-family: var(--font-serif);
    background: var(--bg);
    color: var(--text);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(232, 129, 127, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 60%, rgba(212, 131, 123, 0.03) 0%, transparent 50%);
    min-height: 100vh;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }

  /* Login */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 3rem 2.5rem;
    width: 380px; max-width: 90vw; box-shadow: var(--shadow);
    text-align: center;
  }
  .login-card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .login-card .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .login-card label { display: block; text-align: left; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
  .login-card input[type=password] {
    width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border);
    border-radius: 50px; font-family: inherit; font-size: 0.95rem;
    margin-bottom: 1.2rem; outline: none; transition: border-color var(--duration);
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card .btn {
    width: 100%; padding: 0.75rem; border-radius: 50px;
    border: none; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: background var(--duration);
  }
  .login-card .btn:hover { background: var(--accent-dark); }
  .login-card .err { color: var(--accent); font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2em; }

  /* Dashboard */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
  }
  .topbar h1 { font-size: 1.5rem; font-weight: 700; }
  .topbar .btn-sm {
    padding: 0.45rem 1.2rem; border-radius: 50px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: inherit; font-size: 0.8rem; color: var(--muted);
    cursor: pointer; transition: all var(--duration);
  }
  .topbar .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .topbar .btn-sm.danger:hover { border-color: var(--accent-dark); color: var(--accent-dark); background: rgba(232,129,127,0.05); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 1.5rem;
    text-align: center; box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }

  .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tabs button {
    padding: 0.6rem 1.5rem; border: none; background: none;
    font-family: inherit; font-size: 0.9rem; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all var(--duration);
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem; }
  .btn-primary {
    padding: 0.5rem 1.5rem; border-radius: 50px;
    border: none; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: background var(--duration);
  }
  .btn-primary:hover { background: var(--accent-dark); }

  .item-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .item-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 1rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; box-shadow: var(--shadow);
  }
  .item-row .info { flex: 1; min-width: 0; }
  .item-row .info .item-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-row .info .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
  .item-row .actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .item-row .actions button {
    padding: 0.35rem 0.8rem; border-radius: 50px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: inherit; font-size: 0.75rem; cursor: pointer;
    transition: all var(--duration);
  }
  .item-row .actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .item-row .actions .del-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); background: rgba(232,129,127,0.05); }

  /* Edit modal */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(61, 44, 44, 0.4); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--surface); border-radius: var(--radius);
    max-width: 700px; width: 100%; max-height: 85vh;
    overflow-y: auto; padding: 2.5rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .modal-content h2 { font-size: 1.3rem; margin-bottom: 1.5rem; }
  .modal-content label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.8rem 0 0.3rem; }
  .modal-content input, .modal-content textarea, .modal-content select {
    width: 100%; padding: 0.6rem 1rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: inherit; font-size: 0.9rem;
    outline: none; transition: border-color var(--duration);
  }
  .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus { border-color: var(--accent); }
  .modal-content textarea { resize: vertical; min-height: 100px; }
  .ql-container { font-family: var(--font-serif) !important; font-size: 0.9rem !important; border-radius: 0 0 var(--radius-sm) var(--radius-sm) !important; }
  .ql-toolbar { border-radius: var(--radius-sm) var(--radius-sm) 0 0 !important; border-color: var(--border) !important; }
  .ql-container { border-color: var(--border) !important; }
  .ql-editor { min-height: 260px; line-height: 1.8; }
  .ql-editor h2 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; font-weight: 600; }
  .ql-editor h3 { font-size: 1rem; margin: 1.2rem 0 0.4rem; }
  .ql-editor p { margin-bottom: 0.7rem; }
  .ql-toolbar button:hover, .ql-toolbar .ql-active { color: var(--accent) !important; }
  .ql-toolbar .ql-stroke { stroke: var(--muted) !important; }
  .ql-toolbar button:hover .ql-stroke, .ql-toolbar .ql-active .ql-stroke { stroke: var(--accent) !important; }
  .ql-toolbar .ql-fill { fill: var(--muted) !important; }
  .ql-toolbar button:hover .ql-fill, .ql-toolbar .ql-active .ql-fill { fill: var(--accent) !important; }
  .ql-toolbar .ql-picker { color: var(--muted) !important; }
  .ql-toolbar .ql-picker:hover, .ql-toolbar .ql-picker-label:hover { color: var(--accent) !important; }
  .modal-content .btn-row { display: flex; gap: 0.8rem; margin-top: 1.5rem; justify-content: flex-end; }
  .modal-content .btn-cancel {
    padding: 0.6rem 1.5rem; border-radius: 50px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .modal-content .btn-save {
    padding: 0.6rem 1.5rem; border-radius: 50px;
    border: none; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .modal-content .btn-save:hover { background: var(--accent-dark); }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    .container { padding: 1.5rem; }
    .modal-content { padding: 1.5rem; }
    .item-row { flex-direction: column; align-items: flex-start; }
    .item-row .actions { align-self: flex-end; }
  }
</style>
</head>
<body>

<div class="container hidden" id="loginWrap">
  <div class="login-wrap">
    <div class="login-card">
      <h2>管理后台</h2>
      <p class="sub">请输入密码以继续</p>
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入管理员密码" autofocus>
      <div class="err" id="loginErr"></div>
      <button class="btn" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<div class="container hidden" id="dashboard">
  <div class="topbar">
    <h1>管理后台</h1>
    <div>
      <button class="btn-sm danger" onclick="doLogout()">退出登录</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="active" data-tab="reviews" onclick="switchTab('reviews')">影评管理</button>
    <button data-tab="blog" onclick="switchTab('blog')">博客管理</button>
  </div>

  <div class="toolbar">
    <span style="font-weight:600">内容列表</span>
    <button class="btn-primary" onclick="openCreate()">+ 新建</button>
  </div>

  <div class="item-list" id="itemList"></div>
  <div id="noItems" class="hidden" style="text-align:center;padding:3rem;color:var(--muted)">暂无内容</div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content" id="editContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
const TOKEN_KEY = 'admin_token';
let token = localStorage.getItem(TOKEN_KEY);
let currentTab = 'reviews';
let quillEditor = null;

function initQuill(content) {
  const el = document.getElementById('efContent');
  if (quillEditor) {
    quillEditor.root.innerHTML = content || '';
    return;
  }
  quillEditor = new Quill('#efContent', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'blockquote'],
        ['clean']
      ]
    },
    placeholder: '开始编辑内容...',
  });
  if (content) quillEditor.root.innerHTML = content;
}

function destroyQuill() {
  if (quillEditor) {
    quillEditor = null;
  }
}

function getQuillContent() {
  return quillEditor ? quillEditor.root.innerHTML : '';
}

function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  return fetch(path, { ...options, headers });
}

async function apiJson(path, options = {}) {
  const res = await api(path, options);
  if (res.status === 401) { doLogout(); throw new Error('unauthorized'); }
  return res.json();
}

function doLogout() {
  try { api('/api/admin/logout', { method: 'POST' }); } catch (e) {}
  localStorage.removeItem(TOKEN_KEY);
  token = null;
  showLogin();
}

async function doLogin() {
  const pw = document.getElementById('password').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || '登录失败'; return; }
    token = data.token;
    localStorage.setItem(TOKEN_KEY, token);
    showDashboard();
  } catch (e) { err.textContent = '网络错误'; }
}

function showLogin() {
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('dashboard').classList.add('hidden');
}

function showDashboard() {
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadStats();
  switchTab(currentTab);
}

async function loadStats() {
  try {
    const [reviewsRes, blogRes] = await Promise.all([
      fetch('/api/reviews?per_page=1'),
      fetch('/api/blog?per_page=1'),
    ]);
    const reviewsData = await reviewsRes.json();
    const blogData = await blogRes.json();
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num">${reviewsData.total || 0}</div><div class="label">影评总数</div></div>
      <div class="stat-card"><div class="num">${blogData.total || 0}</div><div class="label">博客总数</div></div>
    `;
  } catch (e) { console.error(e); }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  loadItems();
}

async function loadItems() {
  const list = document.getElementById('itemList');
  const noItems = document.getElementById('noItems');
  list.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted)">加载中...</div>';
  noItems.classList.add('hidden');

  try {
    if (currentTab === 'reviews') {
      const data = await apiJson('/api/reviews?per_page=50');
      if (!data.reviews || data.reviews.length === 0) { list.innerHTML = ''; noItems.classList.remove('hidden'); return; }
      list.innerHTML = data.reviews.map(r => `
        <div class="item-row">
          <div class="info">
            <div class="item-title">${r.title}</div>
            <div class="meta">${r.drama_title || ''} &middot; ${r.author} &middot; Rating ${r.rating} &middot; ID: ${r.id}</div>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick="openEdit('review', ${r.id})">编辑</button>
            <button class="del-btn" onclick="deleteItem('review', ${r.id})">删除</button>
          </div>
        </div>
      `).join('');
    } else {
      const data = await apiJson('/api/blog?per_page=50');
      if (!data.posts || data.posts.length === 0) { list.innerHTML = ''; noItems.classList.remove('hidden'); return; }
      list.innerHTML = data.posts.map(p => `
        <div class="item-row">
          <div class="info">
            <div class="item-title">${p.title}</div>
            <div class="meta">${p.tags || ''} &middot; ${p.author} &middot; ID: ${p.id}</div>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick="openEdit('blog', ${p.id})">编辑</button>
            <button class="del-btn" onclick="deleteItem('blog', ${p.id})">删除</button>
          </div>
        </div>
      `).join('');
    }
    noItems.classList.add('hidden');
  } catch (e) {
    list.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted)">加载失败</div>';
  }
}

async function openCreate() {
  destroyQuill();
  if (currentTab === 'reviews') {
    document.getElementById('editContent').innerHTML = `
      <h2>新建影评</h2>
      <label>Drama ID</label><input type="number" id="efDramaId" value="1">
      <label>标题</label><input type="text" id="efTitle">
      <label>作者</label><input type="text" id="efAuthor" value="匿名用户">
      <label>摘要</label><textarea id="efSummary" rows="2"></textarea>
      <label>内容（可图文混排）</label><div id="efContent" style="height:320px"></div>
      <label>评分</label><input type="number" id="efRating" value="0" step="0.1" min="0" max="5">
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveCreate()">保存</button>
      </div>`;
  } else {
    document.getElementById('editContent').innerHTML = `
      <h2>新建博客</h2>
      <label>标题</label><input type="text" id="efTitle">
      <label>摘要</label><textarea id="efSummary" rows="2"></textarea>
      <label>内容（可图文混排）</label><div id="efContent" style="height:360px"></div>
      <label>标签 (逗号分隔)</label><input type="text" id="efTags">
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveCreate()">保存</button>
      </div>`;
  }
  initQuill('');
  document.getElementById('editModal').classList.add('show');
}

async function openEdit(type, id) {
  try {
    const path = type === 'review' ? `/api/reviews/${id}` : `/api/blog/${id}`;
    const data = await apiJson(path);
    const item = data.review || data.post;
    destroyQuill();

    if (type === 'review') {
      document.getElementById('editContent').innerHTML = `
        <h2>编辑影评 #${id}</h2>
        <label>Drama ID</label><input type="number" id="efDramaId" value="${item.drama_id || 0}">
        <label>标题</label><input type="text" id="efTitle" value="${escHtml(item.title || '')}">
        <label>作者</label><input type="text" id="efAuthor" value="${escHtml(item.author || '')}">
        <label>摘要</label><textarea id="efSummary" rows="2">${escHtml(item.summary || '')}</textarea>
        <label>内容（可图文混排）</label><div id="efContent" style="height:320px"></div>
        <label>评分</label><input type="number" id="efRating" value="${item.rating || 0}" step="0.1" min="0" max="5">
        <div class="btn-row">
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-save" onclick="saveEdit('review', ${id})">保存</button>
        </div>`;
    } else {
      document.getElementById('editContent').innerHTML = `
        <h2>编辑博客 #${id}</h2>
        <label>标题</label><input type="text" id="efTitle" value="${escHtml(item.title || '')}">
        <label>摘要</label><textarea id="efSummary" rows="2">${escHtml(item.summary || '')}</textarea>
        <label>内容（可图文混排）</label><div id="efContent" style="height:360px"></div>
        <label>标签 (逗号分隔)</label><input type="text" id="efTags" value="${escHtml(item.tags || '')}">
        <div class="btn-row">
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-save" onclick="saveEdit('blog', ${id})">保存</button>
        </div>`;
    }
    initQuill(item.content || '');
    document.getElementById('editModal').classList.add('show');
  } catch (e) { alert('加载失败'); }
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function saveCreate() {
  try {
    if (currentTab === 'reviews') {
      const body = {
        drama_id: parseInt(document.getElementById('efDramaId').value) || 0,
        title: document.getElementById('efTitle').value,
        author: document.getElementById('efAuthor').value || '匿名用户',
        summary: document.getElementById('efSummary').value,
        content: getQuillContent(),
        rating: parseFloat(document.getElementById('efRating').value) || 0,
      };
      await apiJson('/api/admin/reviews', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
    } else {
      const body = {
        title: document.getElementById('efTitle').value,
        summary: document.getElementById('efSummary').value,
        content: getQuillContent(),
        tags: document.getElementById('efTags').value,
      };
      await apiJson('/api/admin/blog', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
    }
    closeModal();
    loadItems();
    loadStats();
  } catch (e) { alert('保存失败'); }
}

async function saveEdit(type, id) {
  try {
    if (type === 'review') {
      const body = {
        drama_id: parseInt(document.getElementById('efDramaId').value) || 0,
        title: document.getElementById('efTitle').value,
        author: document.getElementById('efAuthor').value || '匿名用户',
        summary: document.getElementById('efSummary').value,
        content: getQuillContent(),
        rating: parseFloat(document.getElementById('efRating').value) || 0,
      };
      await apiJson(`/api/admin/reviews/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
    } else {
      const body = {
        title: document.getElementById('efTitle').value,
        summary: document.getElementById('efSummary').value,
        content: getQuillContent(),
        tags: document.getElementById('efTags').value,
      };
      await apiJson(`/api/admin/blog/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
    }
    closeModal();
    loadItems();
  } catch (e) { alert('保存失败'); }
}

async function deleteItem(type, id) {
  if (!confirm(`确定要删除这个${type === 'review' ? '影评' : '博客'}吗？此操作不可撤销。`)) return;
  try {
    await apiJson(`/api/admin/${type}/${id}`, { method: 'DELETE' });
    loadItems();
    loadStats();
  } catch (e) { alert('删除失败'); }
}

function closeModal() { destroyQuill(); document.getElementById('editModal').classList.remove('show'); }

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});

if (token) { showDashboard(); } else { showLogin(); }
</script>
</body>
</html>
